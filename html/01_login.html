<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>넥슨 회원로그인</title>
    <link rel="stylesheet" href="../css/01_login.css">
</head>

<body>

    <main class="main">
        <div class="nexon"><img src="../images/01_login/svg_.svg" alter="nexon_logo"></div>

        <section>
            <div class="outersection">
                <div class="uppersection">
                    <div class="login_tabs">
                        <button type="button" class="login tab active" data-target="id_login"> 넥슨ID로그인 </button>
                        <button type="button" class="login tab" data-target="tmp_login">일회용 로그인 </button>
                        <button type="button" class="login tab" data-target="qr_login">QR로그인 </button>
                    </div>
                
                    <div class="innersection">
                        <div class="signin_details">
                            <input class="details" type="email" placeholder="넥슨ID(아이디 또는 이메일)" required>
                            <input class="details" type="password" placeholder="비밀번호" required>
                        </div>
                        <div class="stay">
                            <input type="checkbox" title="stay_signed_in">로그인 상태유지
                        </div>
                    </div>
                </div>
                    <div>
                        <input type="submit" value="넥슨 ID 로그인">
                    </div>
                    <div class="below_login">
                        <div class="find_my">
                            <a href="#"> 회원가입</a>
                            <a href="#"> 넥슨 ID 찾기</a>
                            <a href="#"> 비밀번호 찾기</a>
                        </div>
                        <a href="#" class="security center"> 보안센터 </div>
                    </div>
                    <div class="OR">
                        <div>
                            <span> </span>
                            <div> 또는</div>
                            <span> </span>
                        </div>
                    </div>
                    <div>
                        <p> 다른 계정으로 로그인</p>
                    </div>
                    <div class="alt_account">
                        <div>
                            <div class="facebook"><button><a><img src="../images/01_login/facebook.svg" alt="facebook"
                                            width="56px" height="56px"></a></button></div>
                            <div class="google"><button><a><img src="../images/01_login/google.svg" alt="google"
                                            width="56px" height="56px"></a></div>
                            <div class="naver"><button><a><img src="../images/01_login/naver.svg" alt="naver"
                                            width="56px" height="56px"></a></div>
                            <div class="apple"><button><a><img src="../images/01_login/apple.svg" alt="apple"
                                            width="56px" height="56px"></a></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section>
            <div class="promo"><img scr="../images/01_login/npay_banner.png"></div>
        </section>
    </main>


</body>

</html>
